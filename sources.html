<script src="js/ui.js?v=20260826b"></script>
<script>
let SOURCES = [];
const branchOf = id => id.startsWith('s-m-') ? 'moskal' : 'albert';

fetch('data/sources.json').then(r=>r.json()).then(d=>{
  SOURCES = d.map(s=>({...s, branch: branchOf(s.id)}))
             .sort((a,b)=> (a.publication||'').localeCompare(b.publication||''));
  draw();
});

let filter='all', q='';
function draw(){
  let list = SOURCES;
  if(filter!=='all') list = list.filter(s=>s.branch===filter);
  if(q) list = list.filter(s => (s.title+s.author+s.publication+s.repository+(s.notes||[]).join(' ')).toLowerCase().includes(q));
  document.getElementById('count').textContent = `${list.length} מקורות`;
  document.getElementById('list').innerHTML = list.map(s=>`
    <div class="sitem">
      <h3>${esc(s.title)||'(ללא כותרת)'}</h3>
      ${s.author?`<p class="meta">${esc(s.author)}</p>`:''}
      <p class="meta">${[s.publication,s.repository,s.citation].filter(Boolean).map(esc).join(' · ')}</p>
      ${(s.notes||[]).length?`<div class="notes">${s.notes.map(esc).join('<br><br>')}</div>`:''}
    </div>`).join('') || '<p class="count">אין מקורות תואמים</p>';
}
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  draw();
}));
document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.trim().toLowerCase(); draw(); });
</script>
