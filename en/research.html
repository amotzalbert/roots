<script>
/* מרנדר markdown בסיסי — כותרות, טבלאות, הדגשות, קישורים, ציטוטים.
   בלי ספריות; הקבצים שלנו משתמשים בתת-קבוצה צפויה של התחביר. */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  return s
    .replace(/`([^`]+)`/g, (m,c)=>`<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
}
function render(md){
  const lines = md.split('\n'); const out = []; let i = 0, inList = false, inQuote = false;
  const closeAll = () => { if(inList){out.push('</ul>');inList=false;} if(inQuote){out.push('</blockquote>');inQuote=false;} };
  while(i < lines.length){
    let l = lines[i];
    if(/^\s*```/.test(l)){ closeAll(); const buf=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); i++; continue; }
    if(/^\|/.test(l)){ closeAll(); const rows=[];
      while(i<lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>inline(esc(c.trim())));
      const head = cells(rows[0]);
      const body = rows.slice(1).filter(r=>!/^\|[\s\-:|]+\|?$/.test(r)).map(cells);
      out.push('<table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'
        + body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');
      continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ closeAll(); const n=Math.min(h[1].length,3);
      out.push(`<h${n}>${inline(esc(h[2]))}</h${n}>`); i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ if(inQuote){out.push('</blockquote>');inQuote=false;}
      if(!inList){out.push('<ul>');inList=true;}
      out.push(`<li>${inline(esc(l.replace(/^\s*[-*]\s+/,'')))}</li>`); i++; continue; }
    if(/^\s*>\s?/.test(l)){ if(inList){out.push('</ul>');inList=false;}
      if(!inQuote){out.push('<blockquote>');inQuote=true;}
      out.push(`<p>${inline(esc(l.replace(/^\s*>\s?/,'')))}</p>`); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ closeAll(); out.push('<hr>'); i++; continue; }
    if(/^\s*$/.test(l)){ closeAll(); i++; continue; }
    closeAll();
    // צירוף שורות רצופות לפסקה אחת
    const buf=[l];
    while(i+1<lines.length && !/^\s*$/.test(lines[i+1]) && !/^(\||#|>|\s*[-*]\s|```|\s*---)/.test(lines[i+1]))
      buf.push(lines[++i]);
    out.push(`<p>${inline(esc(buf.join(' ')))}</p>`); i++;
  }
  closeAll(); return out.join('\n');
}

(async function(){
  const box = document.getElementById('md');
  const f = new URLSearchParams(location.search).get('f') || '';
  // ⚠ בטיחות: מותר לטעון אך ורק קבצים מתוך research/
  if(!/^research\/[a-z0-9\-]+\.md$/.test(f)){
    box.innerHTML = '<p class="kicker">Source report</p><p>קובץ לא נמצא. <a href="map.html">חזרה למפה ←</a></p>';
    return;
  }
  try{
    const md = await fetch(f + '?v=20260819').then(r=>{ if(!r.ok) throw 0; return r.text(); });
    box.innerHTML = '<p class="kicker">Source report · ' + esc(f.replace('research/','').replace('.md','')) + '</p>'
      + '<div class="srcnote">⚠ An internal working report of the research — raw notes with source references, not an edited chapter. The edited chapters are in the menu above. Reports are also available in Hebrew (the original) and Polish via the flags above.</div>'
      + render(md)
      + '<p class="backlink"><a href="map.html">← Back to the map</a></p>';
    document.title = f.replace('research/','').replace('.md','') + ' · Source report · Roots';
  }catch(e){
    box.innerHTML = '<p class="kicker">Source report</p><p>הקובץ לא נטען. <a href="map.html">חזרה למפה ←</a></p>';
  }
})();
</script>
