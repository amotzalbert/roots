<script src="js/ui.js?v=20260821c"></script>
<script>
let INDEX = [];
fetch('data/index.json').then(r=>r.json()).then(d=>INDEX=d);

const BADGE = {moskal:'מוסקל–שאפיר', albert:'אלברט–ריבנבייריך', both:'שני הענפים', '':''};
function render(list){
  const box = document.getElementById('results');
  if(!list.length){ box.innerHTML = '<p class="empty">אין תוצאות</p>'; return; }
  box.innerHTML = list.slice(0,30).map(r=>{
    const href = r.type==='person' ? `tree.html?p=${encodeURIComponent(r.id)}` : `map.html`;
    const badgeCls = r.type==='place' ? 'place' : (r.branch||'');
    const badgeTxt = r.type==='place' ? 'מקום' : (BADGE[r.branch]||'');
    return `<a class="result" href="${href}">
      <span class="badge ${badgeCls}">${badgeTxt}</span>
      <span class="main">${r.label}</span>
      <span class="lat">${r.sub||''}</span>
    </a>`;
  }).join('');
}
document.getElementById('q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if(q.length<2){ document.getElementById('results').innerHTML=''; return; }
  render(INDEX.filter(r => r.terms.toLowerCase().includes(q)));
});
</script>
